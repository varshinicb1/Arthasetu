openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ArthaSetu Merchant Assurance Layer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Transaction operations
  - name: merchant
    description: Merchant decision operations
  - name: fraud
    description: Fraud simulation operations
  - name: sync
    description: Sync engine operations
  - name: logs
    description: System log operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /transactions:
    get:
      operationId: getTransactions
      tags: [transactions]
      summary: Get all transactions
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{txnId}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/{txnId}/decide:
    post:
      operationId: merchantDecide
      tags: [merchant]
      summary: Merchant accepts or rejects a transaction
      parameters:
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantDecisionRequest"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fraud/simulate:
    post:
      operationId: simulateFraud
      tags: [fraud]
      summary: Simulate a fraud event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FraudSimulationRequest"
      responses:
        "200":
          description: Fraud event simulated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FraudSimulationResponse"

  /sync:
    post:
      operationId: syncTransactions
      tags: [sync]
      summary: Sync all pending transactions (requires ONLINE mode)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"

  /logs:
    get:
      operationId: getLogs
      tags: [logs]
      summary: Get system logs
      responses:
        "200":
          description: System logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
    delete:
      operationId: clearLogs
      tags: [logs]
      summary: Clear all system logs
      responses:
        "200":
          description: Logs cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /network/status:
    get:
      operationId: getNetworkStatus
      tags: [sync]
      summary: Get current network status
      responses:
        "200":
          description: Network status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"
    post:
      operationId: setNetworkStatus
      tags: [sync]
      summary: Set network status (ONLINE/OFFLINE)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetNetworkStatusRequest"
      responses:
        "200":
          description: Network status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"

  /demo/run:
    post:
      operationId: runDemo
      tags: [sync]
      summary: Run the automated demo flow
      responses:
        "200":
          description: Demo started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Transaction:
      type: object
      properties:
        txn_id:
          type: string
        amount:
          type: number
        customer_id:
          type: string
        customer_name:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
        timestamp:
          type: string
        status:
          type: string
          enum: [PENDING, UNCONFIRMED, SUCCESS, FAILED, REJECTED, ACCEPTED, ACCEPTED_WITH_RISK]
        signature:
          type: string
        confidence_score:
          type: number
        confidence_level:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        merchant_decision:
          type: string
          enum: [PENDING, ACCEPTED, ACCEPTED_WITH_RISK, REJECTED]
        fraud_flags:
          type: array
          items:
            type: string
        network_mode:
          type: string
          enum: [ONLINE, OFFLINE]
      required:
        - txn_id
        - amount
        - customer_id
        - customer_name
        - merchant_id
        - merchant_name
        - timestamp
        - status
        - signature
        - confidence_score
        - confidence_level
        - merchant_decision
        - fraud_flags
        - network_mode

    CreateTransactionRequest:
      type: object
      properties:
        amount:
          type: number
        customer_id:
          type: string
        customer_name:
          type: string
        merchant_id:
          type: string
        merchant_name:
          type: string
      required:
        - amount
        - customer_id
        - customer_name
        - merchant_id
        - merchant_name

    MerchantDecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum: [ACCEPTED, ACCEPTED_WITH_RISK, REJECTED]
      required:
        - decision

    FraudSimulationRequest:
      type: object
      properties:
        type:
          type: string
          enum: [DOUBLE_ATTEMPT, RAPID_TRANSACTIONS, FAKE_RETRY]
        txn_id:
          type: string
      required:
        - type

    FraudSimulationResponse:
      type: object
      properties:
        message:
          type: string
        affected_transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        log_entry:
          $ref: "#/components/schemas/LogEntry"
      required:
        - message
        - affected_transactions
        - log_entry

    SyncRequest:
      type: object
      properties:
        force:
          type: boolean
      required: []

    SyncResponse:
      type: object
      properties:
        synced_count:
          type: number
        success_count:
          type: number
        failed_count:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
      required:
        - synced_count
        - success_count
        - failed_count
        - transactions

    LogEntry:
      type: object
      properties:
        id:
          type: string
        level:
          type: string
          enum: [INFO, WARNING, ERROR, SYNC]
        message:
          type: string
        timestamp:
          type: string
        txn_id:
          type: string
      required:
        - id
        - level
        - message
        - timestamp

    NetworkStatus:
      type: object
      properties:
        mode:
          type: string
          enum: [ONLINE, OFFLINE]
        updated_at:
          type: string
      required:
        - mode
        - updated_at

    SetNetworkStatusRequest:
      type: object
      properties:
        mode:
          type: string
          enum: [ONLINE, OFFLINE]
      required:
        - mode

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
